services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"          # for apps on Windows (IntelliJ, PowerShell): localhost:9092
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"          # any 22-char base64 UUID; fixed so restarts reuse it
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # combined mode: this node is broker AND KRaft controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1     # only 1 broker, so RF must be 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3                       # default partitions for auto-created topics

  kafka-ui:
    image: kafbat/kafka-ui:latest                   # free, open-source UI (maintained fork of provectus kafka-ui)
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092  # containers talk on the internal listener
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka